<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0A0612">
<title>Творческая комната</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Неоновая тема: тёмный фон с живым «северным сиянием», у каждого помещения свой светящийся градиент.
   🎨 Творческая — розовый → оранжевый, 🪚 СтСка — бирюзовый → лайм, ваши записи — фиолетовый. */
:root{
  color-scheme:dark;
  --bg:#0A0612; --surface:#150D22; --surface2:rgba(255,255,255,.09);
  --fg:#F6F0FF; --hint:#A99BC4; --line:rgba(255,255,255,.12);
  --tv1:#FF3DA5; --tv2:#FF9A3D;
  --st1:#1FD8FF; --st2:#8BFF5A;
  --mine:#B57BFF; --mine2:#6E8BFF;
  --busy:#2B1F3F; --closed:#6F6485;
  --a1:var(--tv1); --a2:var(--tv2);
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.9,.25,1.15);
}
body{--grad:linear-gradient(120deg,var(--a1),var(--a2));
  --glow:0 0 12px color-mix(in srgb,var(--a1) 70%,transparent),0 0 34px color-mix(in srgb,var(--a1) 35%,transparent)}
body[data-room="st"]{--a1:var(--st1);--a2:var(--st2)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;min-height:100%}
body{overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;position:relative;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 160px}

/* ── живой фон: светящиеся пятна + сетка ── */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.8}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;will-change:transform;transition:background 1s}
.aurora i:nth-child(1){left:-10%;top:-10%;background:radial-gradient(circle,color-mix(in srgb,var(--a1) 55%,transparent),transparent 65%)}
.aurora i:nth-child(2){right:-15%;top:10%;background:radial-gradient(circle,rgba(124,77,255,.45),transparent 65%)}
.aurora i:nth-child(3){left:10%;bottom:-20%;background:radial-gradient(circle,color-mix(in srgb,var(--a2) 40%,transparent),transparent 65%)}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%)}

/* ── шапка ── */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hint);display:flex;align-items:center;gap:7px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:#3DFF9A;box-shadow:0 0 8px #3DFF9A,0 0 16px #3DFF9A}
h1{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.08;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance;
  background:linear-gradient(90deg,var(--a1),#C77DFF,var(--a2),var(--a1));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.refresh{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 12px;
  background:var(--surface)}
.refresh .ar{display:inline-block}
.demo{margin-top:12px;font-size:12.5px;color:var(--hint);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:9px 11px}

/* ── логотип-ключик ── */
.brandrow{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.logo{display:block;width:96px;height:39px;overflow:visible;border-radius:10px}
.logo svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 8px rgba(255,61,165,.55))}
body[data-room="st"] .logo svg{filter:drop-shadow(0 0 8px rgba(31,216,255,.55))}
.shine{fill:url(#shineGrad)}
.bubble{position:absolute;left:4px;top:50px;max-width:250px;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.3;color:#fff;
  background:linear-gradient(120deg,color-mix(in srgb,var(--a1) 85%,#000),color-mix(in srgb,var(--a2) 80%,#000));box-shadow:0 6px 20px -4px color-mix(in srgb,var(--a1) 60%,transparent);
  transform-origin:22px -8px;transform:scale(.4);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.bubble::before{content:"";position:absolute;left:16px;top:-6px;width:12px;height:12px;border-radius:2px;transform:rotate(45deg);background:color-mix(in srgb,var(--a1) 85%,#000)}
.bubble.on{transform:none;opacity:1}
.fallkey{position:fixed;top:-40px;z-index:30;pointer-events:none;width:44px;height:18px}
.fallkey svg{width:100%;height:100%;display:block;overflow:visible}
.empty .mini{display:block;width:84px;height:34px;margin:0 auto 12px}
.empty .mini svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 10px rgba(255,61,165,.6))}
body[data-room="st"] .empty .mini svg{filter:drop-shadow(0 0 10px rgba(31,216,255,.6))}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:4px}

/* ── вкладки со скользящим индикатором ── */
.tabs{position:relative;display:flex;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--grad);box-shadow:var(--glow);
  transition:transform .25s cubic-bezier(.3,.7,.3,1),background .5s}
.tabs[data-t="mine"]::before{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--hint);transition:color .15s}
.tabs button[aria-selected="true"]{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.tabs .cnt{font-family:var(--mono);font-size:11px;margin-left:5px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.18)}
.tabs .cnt:empty{display:none}

/* ── помещения ── */
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.room{text-align:left;border-radius:18px;padding:14px;background:var(--surface);border:1px solid var(--line);min-width:0;isolation:isolate;
  transition:transform .25s var(--ease),box-shadow .4s,border-color .4s}
.room[data-r="tv"]{--c1:var(--tv1);--c2:var(--tv2)}
.room[data-r="st"]{--c1:var(--st1);--c2:var(--st2)}
.room .em{font-size:26px;line-height:1;display:inline-block}
.room .nm{font-family:var(--display);font-weight:600;font-size:14.5px;margin-top:10px}
.room .fr{font-size:12px;color:var(--hint);margin-top:3px}
/* активная плитка: вращающаяся светящаяся рамка */
.room::before{content:"";position:absolute;inset:-60%;z-index:-2;opacity:0;transition:opacity .4s;
  background:conic-gradient(from 0deg,transparent 0 55%,var(--c1),var(--c2),transparent 85%)}
.room::after{content:"";position:absolute;inset:1.5px;z-index:-1;border-radius:16.5px;background:linear-gradient(160deg,#1A1028,#120A1E)}
.room[aria-pressed="true"]{border-color:transparent;box-shadow:0 0 18px color-mix(in srgb,var(--c1) 45%,transparent),0 0 42px color-mix(in srgb,var(--c2) 20%,transparent)}
.room[aria-pressed="true"]::before{opacity:1}
.room[aria-pressed="true"] .fr{color:color-mix(in srgb,var(--c2) 75%,#fff)}
.room[aria-pressed="true"] .nm{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── лента дней ── */
.days{display:flex;gap:8px;margin:8px -16px 0;padding:12px 16px 16px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:60px;scroll-snap-align:start;border-radius:16px;padding:9px 0 8px;text-align:center;background:var(--surface);border:1px solid var(--line);
  transition:transform .25s var(--ease),box-shadow .35s,background .35s}
.day .wd{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint)}
.day .dn{font-family:var(--display);font-weight:600;font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums}
.day .occ{display:block;height:4px;margin:7px 11px 0;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.day .occ i{display:block;height:100%;background:var(--grad);border-radius:2px}
.day[aria-pressed="true"]{background:var(--grad);border-color:rgba(255,255,255,.25);color:#fff;box-shadow:0 4px 12px -2px color-mix(in srgb,var(--a1) 60%,transparent),0 0 0 1px color-mix(in srgb,var(--a1) 40%,transparent)}
.day[aria-pressed="true"] .wd{color:#fff;opacity:.85}
.day[aria-pressed="true"] .occ{background:rgba(255,255,255,.3)}
.day[aria-pressed="true"] .occ i{background:#fff;box-shadow:none}
.day.closed{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 6px,rgba(255,255,255,.1) 6px 8px)}
.day.closed .occ{opacity:0}
.day.closed .dn{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.day[aria-pressed="true"].closed{background:linear-gradient(120deg,#4A3D63,#2E2442);box-shadow:none}

/* ── таймлайн ── */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:14px 0 10px}
.dayhead h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
.dayhead h2::first-letter{text-transform:uppercase}
.dayhead .sum{font-family:var(--mono);font-size:11.5px;color:var(--hint);text-align:right}
.tl{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;align-items:stretch}
.row .t{font-family:var(--mono);font-size:12px;color:var(--hint);padding-top:11px;font-variant-numeric:tabular-nums}
.slot{min-height:42px;border-radius:12px;padding:9px 12px;text-align:left;display:flex;align-items:center;gap:8px;min-width:0;
  background:rgba(255,255,255,.035);border:1px dashed rgba(255,255,255,.14);font-size:13.5px;
  transition:transform .2s var(--ease),background .3s,border-color .3s,box-shadow .3s}
.slot .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .ic{flex:none}
.slot.free .lb{color:var(--hint)}
@media (hover:hover){.slot.free:not(.past):hover{border-color:color-mix(in srgb,var(--a1) 60%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--a1) 25%,transparent)}}
.slot.shared{border-style:solid;border-color:color-mix(in srgb,var(--a2) 70%,transparent);background:color-mix(in srgb,var(--a2) 14%,transparent);
  box-shadow:inset 0 0 18px color-mix(in srgb,var(--a2) 18%,transparent)}
.slot.busy{border-style:solid;border-color:rgba(255,255,255,.06);color:#CFC3E6;cursor:not-allowed;
  background:repeating-linear-gradient(-45deg,#1C142B 0 10px,#22192F 10px 20px)}
.slot.mine{border-style:solid;border-color:var(--mine);color:#E7D8FF;font-weight:600;cursor:default;
  background:linear-gradient(90deg,color-mix(in srgb,var(--mine) 26%,transparent),color-mix(in srgb,var(--mine2) 12%,transparent));
  box-shadow:0 0 14px color-mix(in srgb,var(--mine) 45%,transparent),inset 0 0 12px color-mix(in srgb,var(--mine) 25%,transparent)}
.slot.past{opacity:.3;cursor:not-allowed}
.slot.sel{border:1px solid transparent;background:var(--grad);color:#fff;font-weight:600;box-shadow:var(--glow);z-index:1}
.slot.sel .lb{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.slot.blocked{border:1px solid rgba(255,59,92,.35);color:#FFB3C1;cursor:not-allowed;
  background:repeating-linear-gradient(-45deg,rgba(255,59,92,.13) 0 10px,rgba(255,59,92,.05) 10px 20px)}
.legend i.x{border:1px solid rgba(255,59,92,.5);background:repeating-linear-gradient(-45deg,rgba(255,59,92,.35) 0 3px,rgba(255,59,92,.1) 3px 6px)}
.closedcard{border-radius:18px;padding:26px 16px;text-align:center;background:var(--surface);border:1px dashed var(--closed)}
.closedcard b{display:block;font-family:var(--display);font-size:17px;margin-bottom:6px}
.closedcard span{color:var(--hint);font-size:13.5px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:12px;color:var(--hint)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.04)}
.legend i.s{border:1px solid var(--a2);background:color-mix(in srgb,var(--a2) 25%,transparent);box-shadow:0 0 6px var(--a2)}
.legend i.b{border:0;background:repeating-linear-gradient(-45deg,#2B2040 0 3px,#3A2D52 3px 6px)}
.legend i.m{border:1px solid var(--mine);background:color-mix(in srgb,var(--mine) 30%,transparent);box-shadow:0 0 6px var(--mine)}

/* ── мои записи ── */
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.bk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border-radius:18px;padding:14px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--c1) 16%,transparent),rgba(255,255,255,.04));border:1px solid color-mix(in srgb,var(--c1) 45%,transparent);
  box-shadow:0 0 22px color-mix(in srgb,var(--c1) 18%,transparent)}
.bk[data-r="tv"]{--c1:var(--tv1)} .bk[data-r="st"]{--c1:var(--st1)}
.bk .em{font-size:26px;filter:drop-shadow(0 0 8px var(--c1))}
.bk .w{font-family:var(--display);font-weight:600;font-size:14px}
.bk .m{font-size:12.5px;color:var(--hint);margin-top:3px}
.bk .x{border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;background:rgba(255,255,255,.05);transition:background .25s,box-shadow .25s}
.bk .x.armed{background:#FF3B5C;border-color:#FF3B5C;color:#fff;box-shadow:0 0 14px #FF3B5C,0 0 30px rgba(255,59,92,.5)}
.empty{text-align:center;color:var(--hint);padding:34px 14px;border:1px dashed var(--line);border-radius:18px;margin-top:16px;background:var(--surface)}
.empty .big{font-size:38px;display:block;margin-bottom:8px;filter:drop-shadow(0 0 12px var(--a1))}

/* ── председатель студсовета ── */
.chair{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:center;width:100%;margin-top:22px;padding:14px;border-radius:20px;text-align:left;isolation:isolate;
  background:#150D22;border:1px solid transparent;box-shadow:0 10px 30px -12px rgba(124,77,255,.55)}
.chair::before{content:"";position:absolute;inset:-80%;z-index:-2;background:conic-gradient(from 0deg,#FF3DA5,#7C4DFF,#1FD8FF,#8BFF5A,#FFB03D,#FF3DA5)}
.chair::after{content:"";position:absolute;inset:1.5px;z-index:-1;border-radius:18.5px;background:linear-gradient(135deg,#1C1030,#120A1E 60%,#1A0F2A)}
.chair-ava{position:relative;width:52px;height:52px;display:grid;place-items:center}
.chair-ring{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#7C4DFF,#FF3DA5);box-shadow:0 0 18px rgba(124,77,255,.7)}
.chair-ring::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(199,125,255,.55)}
.chair-emo{position:relative;font-size:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.chair-tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.chair-kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#C9A8FF}
.chair-tx b{font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.25}
.chair-sub{font-size:12px;color:var(--hint)}
.chair-go{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:6px;padding:12px;border-radius:13px;font-weight:600;font-size:14.5px;color:#fff;white-space:nowrap;
  background:linear-gradient(120deg,#7C4DFF,#FF3DA5);box-shadow:0 0 16px rgba(124,77,255,.6)}

/* ── нижняя панель выбора ── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:rgba(18,10,30,.72);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border-top:1px solid transparent;border-image:var(--grad) 1;box-shadow:0 -10px 40px color-mix(in srgb,var(--a1) 22%,transparent);
  transform:translateY(115%);transition:transform .5s var(--ease)}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:11px}
.sheet .line1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sheet .rng{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sheet .dur{font-family:var(--mono);font-size:12px;color:var(--hint)}
.share{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:left;width:100%}
.share .tx b{display:block;font-size:14px}
.share .tx span{font-size:12px;color:var(--hint)}
.sw{flex:none;width:46px;height:27px;border-radius:14px;background:rgba(255,255,255,.14);position:relative;transition:background .3s,box-shadow .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .35s var(--ease)}
.share[aria-checked="true"] .sw{background:var(--grad);box-shadow:0 0 12px var(--a1)}
.share[aria-checked="true"] .sw::after{transform:translateX(19px)}
.share[aria-disabled="true"]{opacity:.85}
.go{background:var(--grad);background-size:200% 100%;color:#fff;border-radius:14px;padding:14px;font-weight:600;font-size:15px;text-align:center;box-shadow:var(--glow)}
.go.hidden{display:none}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%) scale(.9);z-index:9;
  background:rgba(24,14,40,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--fg);border:1px solid color-mix(in srgb,var(--a1) 60%,transparent);
  box-shadow:0 0 18px color-mix(in srgb,var(--a1) 40%,transparent);padding:10px 16px;border-radius:999px;font-size:13.5px;width:max-content;max-width:calc(100% - 32px);text-align:center;
  transition:transform .45s var(--ease)}
.toast.on{transform:translate(-50%,0) scale(1)}

/* волна от нажатия */
.rip{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);background:radial-gradient(circle,rgba(255,255,255,.45),transparent 70%);z-index:2}
/* искры при записи */
.spark{position:fixed;z-index:20;width:8px;height:8px;border-radius:50%;pointer-events:none}

@media (prefers-reduced-motion:no-preference){
  .aurora i:nth-child(1){animation:drift1 18s ease-in-out infinite alternate}
  .aurora i:nth-child(2){animation:drift2 22s ease-in-out infinite alternate}
  .aurora i:nth-child(3){animation:drift3 26s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(18vw,22vh) scale(1.2)}}
  @keyframes drift2{to{transform:translate(-22vw,28vh) scale(.85)}}
  @keyframes drift3{to{transform:translate(16vw,-26vh) scale(1.15)}}
  h1{animation:shimmer 7s linear infinite}
  @keyframes shimmer{to{background-position:300% 0}}
  .eyebrow::before{animation:blink 2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35;box-shadow:0 0 3px #3DFF9A}}

    58%{transform:perspective(600px) rotateX(-78deg) scale(1.03);filter:drop-shadow(0 0 16px var(--a1)) brightness(1.4);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
    80%{transform:perspective(600px) rotateX(0) scale(1.07);filter:drop-shadow(0 0 12px var(--a1)) brightness(1.15)}
    100%{transform:perspective(600px) rotateX(0) scale(1)}}

}

<script>
(function(){
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.platform && tg.platform !== "unknown");
const ROOMS=[{id:"tv",name:"Творческая",em:"🎨"},{id:"st",name:"СтСка",em:"🪚"}];
const WD=["вс","пн","вт","ср","чт","пт","сб"];
const MG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const hh=h=>String(h).padStart(2,"0")+":00";
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c};

/* ---------- данные ---------- */
function decode(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
  const bin=atob(s),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function demo(){
  const d=new Date(),iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return {v:1,d0:iso,n:7,o:9,c:23,h:Math.min(d.getHours(),12),ts:"пример",mx:0,demo:true,
    b:[[1,0,0,14,17,1,"Аня",0],[2,0,0,15,18,1,"Миша",0],[3,0,0,19,22,0,"Декораторы КВН",0],
       [4,1,0,13,15,0,"Дима",0],[5,0,1,10,13,1,"Вы",1],[6,1,1,16,20,1,"Лера",0],[7,0,2,11,23,0,"Студсовет",0]],
    x:[[1,3]]};
}
let D;
try{const p=new URLSearchParams(location.search).get("d");D=p?decode(p):demo()}catch(e){D=demo()}
const day0=(()=>{const[y,m,d]=D.d0.split("-").map(Number);return new Date(y,m-1,d)})();
const dayDate=i=>{const x=new Date(day0);x.setDate(x.getDate()+i);return x};
const dkey=i=>{const x=dayDate(i);return x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0")};
const B=D.b.map(a=>({id:a[0],r:a[1],d:a[2],s:a[3],e:a[4],sh:a[5],nm:a[6],me:a[7]}));
const closed=new Set(D.x.map(a=>a[0]+":"+a[1]));
const closedH=new Set((D.xh||[]).map(a=>a[0]+":"+a[1]+":"+a[2]));   // отдельные часы, закрытые админом

const S={tab:"sched",r:0,d:0,a:null,b:null,share:true};
// стартуем с первого дня, где ещё можно записаться
for(let i=0;i<D.n;i++){if(i>0||D.h<D.c-1){S.d=i;break}}

function hourInfo(r,d,h){
  if(closed.has(r+":"+d))return{st:"closed"};
  if(closedH.has(r+":"+d+":"+h))return{st:"blocked",over:[],past:d===0&&h<=D.h};
  const over=B.filter(b=>b.r===r&&b.d===d&&b.s<=h&&h<b.e);
  const past=d===0&&h<=D.h;
  const mine=over.find(b=>b.me);
  let st="free";
  if(over.length)st=over.some(b=>!b.sh)?"busy":"shared";
  return{st,over,past,mine};
}
function freeHours(r,d){let n=0;for(let h=D.o;h<D.c;h++){const x=hourInfo(r,d,h);if(x.st==="free"&&!x.past)n++}return n}
function load(r,d){let n=0;for(let h=D.o;h<D.c;h++){if(hourInfo(r,d,h).st!=="free")n++}return n/(D.c-D.o)}

/* ---------- Telegram ---------- */
function haptic(kind){try{if(!tg||!tg.HapticFeedback)return;
  if(kind==="sel")tg.HapticFeedback.selectionChanged();else tg.HapticFeedback.notificationOccurred(kind)}catch(e){}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2400)}
function send(obj){
  if(inTg){try{tg.sendData(JSON.stringify(obj));return}catch(e){}}
  toast(D.demo?"Это пример: в боте сюда придёт ваш запрос":"Откройте приложение кнопкой «📝 Записаться» в боте");
}
function applyTheme(){
  if(!tg)return;
  try{
    tg.ready();tg.expand();
    tg.setHeaderColor&&tg.setHeaderColor("#0A0612");
    tg.setBackgroundColor&&tg.setBackgroundColor("#0A0612");
    tg.setBottomBarColor&&tg.setBottomBarColor("#0A0612");
  }catch(e){}
}

/* ---------- эффекты ---------- */
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const A={first:true,rooms:false,days:false,tl:false,mine:false};
let prev={r:-1,d:-1,tab:""};
function cssVar(n){return getComputedStyle(document.body).getPropertyValue(n).trim()}
document.addEventListener("pointerdown",e=>{
  if(reduce)return;
  const b=e.target.closest("button");if(!b||b.classList.contains("busy")||b.classList.contains("past"))return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),sp=document.createElement("span");
  sp.className="rip";sp.style.width=sp.style.height=s+"px";
  sp.style.left=(e.clientX-r.left-s/2)+"px";sp.style.top=(e.clientY-r.top-s/2)+"px";
  b.appendChild(sp);setTimeout(()=>sp.remove(),650);
},{passive:true});
function burst(x,y){
  if(reduce)return;
  const cols=[cssVar("--a1"),cssVar("--a2"),"#C77DFF","#ffffff"];
  for(let i=0;i<28;i++){
    const p=document.createElement("i");p.className="spark";const c=cols[i%cols.length];
    p.style.left=x+"px";p.style.top=y+"px";p.style.background=c;p.style.boxShadow="0 0 8px "+c+",0 0 16px "+c;
    document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2,dist=60+Math.random()*120;
    p.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist-40}px)) scale(0)`,opacity:0}],
      {duration:700+Math.random()*500,easing:"cubic-bezier(.15,.8,.3,1)"}).onfinish=()=>p.remove();
  }
}

/* ---------- выбор времени ---------- */
function range(){if(S.a===null)return null;const s=Math.min(S.a,S.b),e=Math.max(S.a,S.b)+1;return{s,e}}
function rangeIssue(s,e){
  for(let h=s;h<e;h++){const x=hourInfo(S.r,S.d,h);
    if(x.st==="closed")return"День закрыт";
    if(x.st==="blocked")return hh(h)+" закрыто администратором";
    if(x.past)return"Это время уже прошло";
    if(x.st==="busy")return hh(h)+" уже занято целиком";
    if(x.mine)return"В "+hh(h)+" у вас уже есть запись";}
  if(D.mx&&e-s>D.mx)return"Максимум "+D.mx+" ч за одну запись";
  return null;
}
function rangeHasShared(s,e){for(let h=s;h<e;h++)if(hourInfo(S.r,S.d,h).st==="shared")return true;return false}
function tapHour(h,el){
  const x=hourInfo(S.r,S.d,h);
  if(x.past||x.st==="busy"||x.mine||x.st==="closed"||x.st==="blocked"){
    el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");haptic("warning");
    toast(x.past?"Это время уже прошло":x.mine?"Здесь уже ваша запись":x.st==="blocked"?"Это время закрыто администратором 🚫":"Занято: помещение не делят");return}
  if(S.a===null||S.a!==S.b){S.a=h;S.b=h}            // новый выбор
  else if(h===S.a){S.a=S.b=null}                       // повторный тап — снять
  else{const s=Math.min(S.a,h),e=Math.max(S.a,h)+1,issue=rangeIssue(s,e);
    if(issue){toast(issue);haptic("warning");S.a=h;S.b=h}else{S.b=h}}
  haptic("sel");render();
}

/* ---------- отрисовка ---------- */
function renderRooms(){
  const el=document.getElementById("rooms");el.textContent="";el.classList.toggle("enter",A.rooms);
  ROOMS.forEach((r,i)=>{
    const b=document.createElement("button");b.className="room";b.dataset.r=r.id;b.setAttribute("aria-pressed",String(S.r===i));
    const f=closed.has(i+":"+S.d)?"закрыто":freeHours(i,S.d)+" "+plural(freeHours(i,S.d),"свободный час","свободных часа","свободных часов");
    b.innerHTML='<div class="em"></div><div class="nm"></div><div class="fr"></div>';
    b.querySelector(".em").textContent=r.em;b.querySelector(".nm").textContent=r.name;b.querySelector(".fr").textContent=f;
    b.style.setProperty("--i",i);
    b.onclick=()=>{if(S.r===i)return;S.r=i;S.a=S.b=null;haptic("sel");render()};
    el.appendChild(b);
  });
}
function renderDays(){
  const el=document.getElementById("days");el.textContent="";el.classList.toggle("enter",A.days);
  for(let i=0;i<D.n;i++){
    const d=dayDate(i),b=document.createElement("button");
    const isClosed=closed.has(S.r+":"+i);
    b.className="day"+(isClosed?" closed":"");b.setAttribute("aria-pressed",String(S.d===i));
    b.setAttribute("aria-label",(i===0?"сегодня, ":"")+d.getDate()+" "+MG[d.getMonth()]+(isClosed?", закрыто":""));
    b.innerHTML='<div class="wd"></div><div class="dn"></div><span class="occ"><i></i></span>';
    b.querySelector(".wd").textContent=i===0?"сег":WD[d.getDay()];
    b.querySelector(".dn").textContent=d.getDate();
    b.querySelector(".occ i").style.width=Math.round(load(S.r,i)*100)+"%";
    b.style.setProperty("--i",i);
    b.onclick=()=>{if(S.d===i)return;S.d=i;S.a=S.b=null;haptic("sel");render()};
    el.appendChild(b);
  }
}
function renderTimeline(){
  const d=dayDate(S.d),tl=document.getElementById("tl");tl.textContent="";tl.classList.toggle("enter",A.tl);
  const rel=S.d===0?"сегодня, ":S.d===1?"завтра, ":"";
  document.getElementById("dTitle").textContent=rel+d.getDate()+" "+MG[d.getMonth()];
  if(closed.has(S.r+":"+S.d)){
    document.getElementById("dSum").textContent="";
    tl.innerHTML='<div class="closedcard"><b>🚫 Закрыто</b><span>В этот день администратор закрыл помещение. Выберите другой день или второе помещение.</span></div>';
    return;
  }
  const f=freeHours(S.r,S.d);
  document.getElementById("dSum").textContent=f?("свободно "+f+" ч из "+(D.c-D.o)):"свободных часов нет";
  const rg=range();
  for(let h=D.o;h<D.c;h++){
    const x=hourInfo(S.r,S.d,h);
    const row=document.createElement("div");row.className="row";row.style.setProperty("--i",h-D.o);
    const t=document.createElement("div");t.className="t";t.textContent=hh(h);
    const b=document.createElement("button");b.className="slot";
    const ic=document.createElement("span");ic.className="ic";const lb=document.createElement("span");lb.className="lb";
    const names=x.over?x.over.map(o=>o.me?"вы":o.nm):[];
    if(x.mine){b.classList.add("mine");ic.textContent=x.mine.sh?"🤝":"🔒";lb.textContent="ваша запись"+(names.length>1?" · ещё "+names.filter(n=>n!=="вы").join(", "):"")}
    else if(x.st==="blocked"){b.classList.add("blocked");ic.textContent="🚫";lb.textContent="закрыто администратором"}
    else if(x.st==="busy"){b.classList.add("busy");ic.textContent="🔒";lb.textContent=names.join(", ")}
    else if(x.st==="shared"){b.classList.add("shared");ic.textContent="🤝";lb.textContent=names.join(", ")+" · можно присоединиться"}
    else{b.classList.add("free");lb.textContent=x.past?"":"свободно"}
    if(x.past)b.classList.add("past");
    if(rg&&h>=rg.s&&h<rg.e){
      b.classList.add("sel");const parts=[];
      if(h===rg.s)parts.push("начало");
      if(h===rg.e-1&&rg.e-rg.s>1)parts.push("конец");
      if(x.st==="shared")parts.push("вместе с "+names.join(", "));
      lb.textContent=parts.join(" · ")||"✓";
    }
    b.setAttribute("aria-label",hh(h)+": "+(lb.textContent||"прошло"));
    b.append(ic,lb);b.onclick=()=>tapHour(h,b);
    row.append(t,b);tl.appendChild(row);
  }
}
function renderSheet(){
  const sh=document.getElementById("sheet"),rg=range();
  if(!rg||S.tab!=="sched"){sh.classList.remove("on");if(inTg)tg.MainButton.hide();return}
  const forced=rangeHasShared(rg.s,rg.e);
  if(forced)S.share=true;
  const room=ROOMS[S.r],d=dayDate(S.d);
  document.getElementById("sRng").textContent=hh(rg.s)+"–"+hh(rg.e);
  const n=rg.e-rg.s;
  document.getElementById("sDur").textContent=n+" ч · "+room.em+" "+room.name+" · "+d.getDate()+"."+String(d.getMonth()+1).padStart(2,"0");
  const sw=document.getElementById("sShare");
  sw.setAttribute("aria-checked",String(S.share));sw.setAttribute("aria-disabled",String(forced));
  document.getElementById("sShareHint").textContent=forced?"В это время там уже есть люди, которые делятся, поэтому только так":
    S.share?"В это время смогут прийти другие, кто тоже делится":"🔒 Помещение в эти часы будет только вашим";
  const label="Записаться "+hh(rg.s)+"–"+hh(rg.e);
  sh.classList.add("on");
  if(inTg){
    document.getElementById("sGo").classList.add("hidden");
    try{
      tg.MainButton.setParams({text:label,is_visible:true,is_active:true,
        color:cssVar("--a1")||undefined,text_color:"#ffffff"});
    }catch(e){tg.MainButton.setText(label);tg.MainButton.show()}
  }else{const g=document.getElementById("sGo");g.classList.remove("hidden");g.textContent=label}
}
function book(){
  const rg=range();if(!rg)return;
  const issue=rangeIssue(rg.s,rg.e);if(issue){toast(issue);haptic("error");return}
  const sel=document.querySelector(".slot.sel"),go=document.getElementById("sGo");
  const rc=(sel||go).getBoundingClientRect();burst(rc.left+rc.width/2,rc.top+rc.height/2);
  haptic("success");
  send({a:"book",r:ROOMS[S.r].id,d:dkey(S.d),s:rg.s,e:rg.e,sh:S.share?1:0});
}
function renderMine(){
  const mine=B.filter(b=>b.me&&!(b.d===0&&b.e<=D.h)).sort((a,b)=>a.d-b.d||a.s-b.s);
  document.getElementById("mineCnt").textContent=mine.length?mine.length:"";
  const el=document.getElementById("mineList");el.textContent="";
  if(!mine.length){el.innerHTML='<div class="empty"><span class="mini"><svg viewBox="0 0 885 354"><use href="#keyPath" class="ink"/></svg></span><b>Ключик скучает без дела</b>Записей на ближайшие дни пока нет.<br>Выберите время во вкладке «Расписание» — и он откроет вам комнату 🗝</div>';return}
  const list=document.createElement("div");list.className="list"+(A.mine?" enter":"");
  mine.forEach((b,i)=>{
    const r=ROOMS[b.r],d=dayDate(b.d),rel=b.d===0?"Сегодня":b.d===1?"Завтра":WD[d.getDay()].replace(/^./,c=>c.toUpperCase());
    const card=document.createElement("div");card.className="bk";card.dataset.r=r.id;card.style.setProperty("--i",i);
    card.innerHTML='<div class="em"></div><div><div class="w"></div><div class="m"></div></div><button class="x">Отменить</button>';
    card.querySelector(".em").textContent=r.em;
    card.querySelector(".w").textContent=hh(b.s)+"–"+hh(b.e)+" · "+r.name;
    card.querySelector(".m").textContent=rel+", "+d.getDate()+" "+MG[d.getMonth()]+" · "+(b.sh?"🤝 делитесь":"🔒 только вы");
    const x=card.querySelector(".x");
    x.onclick=()=>{
      if(!x.classList.contains("armed")){x.classList.add("armed");x.textContent="Точно?";haptic("warning");
        setTimeout(()=>{x.classList.remove("armed");x.textContent="Отменить"},3500);return}
      haptic("success");send({a:"cancel",id:b.id});
    };
    list.appendChild(card);
  });
  el.appendChild(list);
}
function render(){
  A.rooms=A.first;A.days=A.first;A.tl=A.first||prev.d!==S.d||(prev.tab!==S.tab&&S.tab==="sched");
  A.mine=prev.tab!==S.tab&&S.tab==="mine";
  prev={r:S.r,d:S.d,tab:S.tab};A.first=false;
  document.body.dataset.room=ROOMS[S.r].id;
  document.getElementById("tabs").dataset.t=S.tab;
  document.getElementById("tabSched").setAttribute("aria-selected",String(S.tab==="sched"));
  document.getElementById("tabMine").setAttribute("aria-selected",String(S.tab==="mine"));
  document.getElementById("vSched").hidden=S.tab!=="sched";
  document.getElementById("vMine").hidden=S.tab!=="mine";
  renderRooms();renderDays();renderTimeline();renderMine();renderSheet();paintKeys();
}
// цвет ключика меняется сразу вместе с помещением: просто переключаем ссылку на нужный градиент
function paintKeys(){const g="url(#kg_"+ROOMS[S.r].id+")";document.querySelectorAll(".ink").forEach(e=>{if(e.getAttribute("fill")!==g)e.setAttribute("fill",g)})}

/* ---------- события ---------- */
document.getElementById("tabSched").onclick=()=>{S.tab="sched";haptic("sel");render()};
document.getElementById("tabMine").onclick=()=>{S.tab="mine";haptic("sel");render()};
document.getElementById("sShare").onclick=()=>{const rg=range();if(rg&&rangeHasShared(rg.s,rg.e)){toast("Тут уже делятся — только совместно");return}S.share=!S.share;haptic("sel");renderSheet()};
document.getElementById("sGo").onclick=book;
document.getElementById("refresh").onclick=()=>send({a:"refresh"});
if(inTg){try{tg.MainButton.onClick(book)}catch(e){}}

/* ---------- ключик: пасхалки ---------- */
const KEY_LINES=["Щёлк! Комната открыта 🔓","Творчество разблокировано ✨","Ключик говорит: «привет!» 👋","Без ключика — никуда 🗝","Ещё чуть-чуть, и откроется что-то секретное…","Вдохновение: 100% 💥","Кто-то сегодня явно сделает шедевр 🎨","Пилим, клеим, творим 🪚"];
function say(t){const b=document.getElementById("bubble");b.textContent=t;b.classList.remove("on");void b.offsetWidth;b.classList.add("on");
  clearTimeout(say.t);say.t=setTimeout(()=>b.classList.remove("on"),2300)}
let keyTaps=0,keyTimer=0,lineIdx=Math.floor(Math.random()*KEY_LINES.length);
function keyRain(){
  if(reduce)return;
  const W=innerWidth,H=innerHeight;
  for(let i=0;i<22;i++){
    const k=document.createElement("div");k.className="fallkey";k.style.left=(Math.random()*(W-44))+"px";
    k.innerHTML='<svg viewBox="0 0 885 354"><use href="#keyPath" class="ink" fill="url(#kg_'+ROOMS[S.r].id+')"/></svg>';
    const s=.6+Math.random()*.9;document.body.appendChild(k);
    k.animate([{transform:`translateY(0) rotate(${Math.random()*360}deg) scale(${s})`,opacity:1},
               {transform:`translateY(${H+80}px) rotate(${Math.random()*720-360}deg) scale(${s})`,opacity:.9}],
      {duration:1600+Math.random()*1400,delay:Math.random()*600,easing:"cubic-bezier(.4,.1,.6,1)",fill:"both"}).onfinish=()=>k.remove();
  }
}
document.getElementById("logo").onclick=e=>{
  const lg=e.currentTarget;lg.classList.remove("turn");void lg.offsetWidth;lg.classList.add("turn");
  clearTimeout(lg.t);lg.t=setTimeout(()=>{   // «щелчок» замка — в момент, когда ключ довернулся
    const r=lg.getBoundingClientRect();burst(r.left+r.width*.21,r.top+r.height/2);
    try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred("rigid")}catch(_){}
  },400);
  keyTaps++;clearTimeout(keyTimer);keyTimer=setTimeout(()=>keyTaps=0,2500);
  if(keyTaps>=7){keyTaps=0;keyRain();haptic("success");say("Секретный ключепад! 🗝🗝🗝");return}
  haptic("sel");say(KEY_LINES[lineIdx++%KEY_LINES.length]);
};

document.getElementById("chair").onclick=()=>{haptic("sel");const url="https://t.me/Yolyich";
  try{if(tg&&tg.openTelegramLink){tg.openTelegramLink(url);return}}catch(e){}window.open(url,"_blank")};

applyTheme();
document.getElementById("stamp").textContent=D.demo?"Студгородок · пример":"Студгородок · данные на "+D.ts;
document.getElementById("demo").hidden=!D.demo;
render();
// прокрутить ленту дней к выбранному
const sel=document.querySelector(".day[aria-pressed='true']");if(sel&&sel.scrollIntoView)sel.scrollIntoView({inline:"center",block:"nearest"});
})();
